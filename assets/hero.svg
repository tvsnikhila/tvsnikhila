<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="nk-hero-title nk-hero-desc">
  <title id="nk-hero-title">TVS Nikhila — Backend Engineer</title>
  <desc id="nk-hero-desc">Animated banner: name, role, and a network of service nodes passing messages.</desc>

  <defs>
    <linearGradient id="nk-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="0.55" stop-color="#0D1530"/>
      <stop offset="1" stop-color="#14204A"/>
    </linearGradient>

    <radialGradient id="nk-hero-glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3D6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3D6BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nk-hero-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3F6FF"/>
      <stop offset="0.6" stop-color="#C9D6FF"/>
      <stop offset="1" stop-color="#7FE7F0"/>
    </linearGradient>

    <linearGradient id="nk-hero-line" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="452" y2="0">
      <stop offset="0" stop-color="#4C7DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5CE1E6"/>
      <stop offset="1" stop-color="#4C7DFF" stop-opacity="0"/>
    </linearGradient>

    <!-- moving sheen across the background -->
    <linearGradient id="nk-hero-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9DB4FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="nk-hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6F86D6" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <filter id="nk-hero-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="nk-hero-clip">
      <rect width="1200" height="340" rx="18"/>
    </clipPath>

    <!-- message routes between nodes -->
    <path id="nk-route-a" d="M760 110 C 830 80, 880 90, 940 140"/>
    <path id="nk-route-b" d="M940 140 C 990 180, 1010 220, 1060 250"/>
    <path id="nk-route-c" d="M760 110 C 770 180, 800 230, 870 255"/>
    <path id="nk-route-d" d="M870 255 C 930 270, 1000 265, 1060 250"/>
    <path id="nk-route-e" d="M940 140 C 900 180, 880 215, 870 255"/>

    <style>
      .nk-route { fill: none; stroke: #4C7DFF; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 6; animation: nk-dash 14s linear infinite; }
      @keyframes nk-dash { to { stroke-dashoffset: -200; } }

      .nk-pulse { transform-box: fill-box; transform-origin: center; animation: nk-pulse 3s ease-in-out infinite; }
      .nk-p2 { animation-delay: .8s; } .nk-p3 { animation-delay: 1.6s; } .nk-p4 { animation-delay: 2.2s; }
      @keyframes nk-pulse { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: .7; transform: scale(1.35); } }

      .nk-orbit { transform-origin: 910px 185px; animation: nk-spin 60s linear infinite; }
      .nk-orbit-rev { transform-origin: 910px 185px; animation: nk-spin 90s linear infinite reverse; }
      @keyframes nk-spin { to { transform: rotate(360deg); } }

      .nk-sheen { animation: nk-sheen 9s ease-in-out infinite; }
      @keyframes nk-sheen { 0% { transform: translateX(-700px); } 100% { transform: translateX(1300px); } }

      .nk-underline-glow { animation: nk-glow 3.5s ease-in-out infinite; }
      @keyframes nk-glow { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

      .nk-cursor { animation: nk-blink 1.1s steps(1) infinite; }
      @keyframes nk-blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .nk-route, .nk-pulse, .nk-orbit, .nk-orbit-rev, .nk-sheen, .nk-underline-glow, .nk-cursor { animation: none; }
        .nk-packet { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#nk-hero-clip)">
    <!-- background -->
    <rect width="1200" height="340" fill="url(#nk-hero-bg)"/>
    <rect width="1200" height="340" fill="url(#nk-hero-grid)"/>
    <rect width="1200" height="340" fill="url(#nk-hero-glow)"/>
    <rect class="nk-sheen" x="0" y="0" width="500" height="340" fill="url(#nk-hero-sheen)"/>

    <!-- orbital geometry behind the network -->
    <g class="nk-orbit" fill="none" stroke="#6F86D6" stroke-opacity="0.18">
      <ellipse cx="910" cy="185" rx="210" ry="120" stroke-dasharray="2 10"/>
      <circle cx="1120" cy="185" r="3" fill="#5CE1E6" fill-opacity="0.7" stroke="none"/>
    </g>
    <g class="nk-orbit-rev" fill="none" stroke="#6F86D6" stroke-opacity="0.12">
      <ellipse cx="910" cy="185" rx="150" ry="150"/>
      <circle cx="910" cy="35" r="2.5" fill="#9DB4FF" stroke="none"/>
    </g>

    <!-- message routes -->
    <use href="#nk-route-a" class="nk-route"/>
    <use href="#nk-route-b" class="nk-route"/>
    <use href="#nk-route-c" class="nk-route"/>
    <use href="#nk-route-d" class="nk-route"/>
    <use href="#nk-route-e" class="nk-route"/>

    <!-- packets travelling between services -->
    <g class="nk-packet">
      <circle r="4" fill="#5CE1E6"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#nk-route-a"/></animateMotion></circle>
      <circle r="4" fill="#9DB4FF"><animateMotion dur="3.6s" begin="1s" repeatCount="indefinite"><mpath href="#nk-route-b"/></animateMotion></circle>
      <circle r="3.5" fill="#5CE1E6"><animateMotion dur="4s" begin=".5s" repeatCount="indefinite"><mpath href="#nk-route-c"/></animateMotion></circle>
      <circle r="3.5" fill="#9DB4FF"><animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#nk-route-d"/></animateMotion></circle>
      <circle r="3" fill="#C9D6FF"><animateMotion dur="2.8s" begin="2.2s" repeatCount="indefinite"><mpath href="#nk-route-e"/></animateMotion></circle>
    </g>

    <!-- service nodes -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C9D6FF" text-anchor="middle">
      <circle class="nk-pulse" cx="760" cy="110" r="22" fill="#4C7DFF" filter="url(#nk-hero-blur)"/>
      <circle cx="760" cy="110" r="13" fill="#0D1530" stroke="#4C7DFF" stroke-width="2"/>
      <text x="760" y="78">API</text>

      <circle class="nk-pulse nk-p2" cx="940" cy="140" r="24" fill="#5CE1E6" filter="url(#nk-hero-blur)"/>
      <circle cx="940" cy="140" r="15" fill="#0D1530" stroke="#5CE1E6" stroke-width="2"/>
      <text x="940" y="108">Pub/Sub</text>

      <circle class="nk-pulse nk-p3" cx="870" cy="255" r="22" fill="#4C7DFF" filter="url(#nk-hero-blur)"/>
      <circle cx="870" cy="255" r="13" fill="#0D1530" stroke="#4C7DFF" stroke-width="2"/>
      <text x="870" y="292">Cache</text>

      <circle class="nk-pulse nk-p4" cx="1060" cy="250" r="22" fill="#9DB4FF" filter="url(#nk-hero-blur)"/>
      <circle cx="1060" cy="250" r="13" fill="#0D1530" stroke="#9DB4FF" stroke-width="2"/>
      <text x="1060" y="287">DB</text>
    </g>

    <!-- text block -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="72" y="96" font-size="15" letter-spacing="4" fill="#7FE7F0">HELLO, I'M</text>
      <text x="70" y="162" font-size="64" font-weight="700" fill="url(#nk-hero-name)">TVS Nikhila</text>

      <!-- drawn underline with glow -->
      <path class="nk-underline-glow" d="M72 186 H 452" stroke="url(#nk-hero-line)" stroke-width="6" filter="url(#nk-hero-blur)"/>
      <path d="M72 186 H 452" stroke="url(#nk-hero-line)" stroke-width="2.5" stroke-linecap="round"/>

      <text x="72" y="226" font-size="22" font-weight="600" fill="#E6ECFF">Backend Engineer<tspan fill="#5CE1E6"> · </tspan>Java &amp; Spring Boot<tspan fill="#5CE1E6"> · </tspan>Real-Time Systems</text>
      <text x="72" y="262" font-size="16" fill="#9DB0E6" font-family="Consolas, 'Courier New', monospace">$ building reliable APIs, caching layers &amp; message pipelines<tspan class="nk-cursor" fill="#5CE1E6">▌</tspan></text>
      <text x="72" y="300" font-size="14" fill="#7086C2">B.Tech CSE · Manipal Institute of Technology, Bengaluru</text>
    </g>

    <!-- frame -->
    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#4C7DFF" stroke-opacity="0.25"/>
  </g>
</svg>
